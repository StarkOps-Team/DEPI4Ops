{{- if .Values.monitoring.enabled }}
# ── Secret: SMTP credentials ──────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-smtp
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "depi4ops.labels" . | nindent 4 }}
type: Opaque
stringData:
  smtp-password: {{ .Values.monitoring.email.password | quote }}
{{- end }}
