{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "depi4ops.labels" . | nindent 4 }}
data:
  alertmanager.yml: |
    global:
      smtp_smarthost: '{{ .Values.monitoring.email.smtpHost }}:{{ .Values.monitoring.email.smtpPort }}'
      smtp_from: '{{ .Values.monitoring.email.from }}'
      smtp_auth_username: '{{ .Values.monitoring.email.username }}'
      smtp_auth_password: '{{ .Values.monitoring.email.password }}'
      smtp_require_tls: {{ .Values.monitoring.email.requireTLS }}

    route:
      group_by: ['alertname', 'namespace', 'severity']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: {{ .Values.monitoring.alerts.repeatInterval }}
      receiver: email-alerts

    receivers:
      - name: email-alerts
        email_configs:
          - to: '{{ .Values.monitoring.email.to }}'
            send_resolved: true

    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity = warning
        equal: ['namespace', 'pod']
{{- end }}
