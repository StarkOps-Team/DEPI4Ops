# ──────────────────────────────────────────────
# Global
# ──────────────────────────────────────────────
nameOverride: ""
fullnameOverride: ""

namespace: depi4ops

# ──────────────────────────────────────────────
# Payload CMS app
# ──────────────────────────────────────────────
payload:
  replicaCount: 1

  image:
    repository: depi4ops-payload
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: LoadBalancer
    port: 3000
    targetPort: 3000

  env:
    PORT: "3000"
    HOSTNAME: "0.0.0.0"

  # Values injected via the Secret (see secret section below)
  # DATABASE_URL and PAYLOAD_SECRET come from the secret

  probes:
    readiness:
      path: /
      port: 3000
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
    liveness:
      path: /
      port: 3000
      initialDelaySeconds: 30
      periodSeconds: 15
      failureThreshold: 6

  resources: {}
  #  limits:
  #    cpu: 500m
  #    memory: 512Mi
  #  requests:
  #    cpu: 250m
  #    memory: 256Mi

# ──────────────────────────────────────────────
# MongoDB
# ──────────────────────────────────────────────
mongo:
  replicaCount: 1

  image:
    repository: mongo
    tag: latest
    pullPolicy: IfNotPresent

  service:
    port: 27017
    targetPort: 27017

  storageEngine: wiredTiger

  persistence:
    enabled: true
    size: 2Gi
    accessMode: ReadWriteOnce
    # storageClass: ""   # leave empty to use cluster default

  resources: {}

# ──────────────────────────────────────────────
# Secret  (stringData – stored as-is in the chart;
#          override with --set or a values override file)
# ──────────────────────────────────────────────
secret:
  databaseUrl: "mongodb://mongo:27017/StarkOps"
  payloadSecret: "5fc2dc3269d77fcd43e46ef5"

# ──────────────────────────────────────────────
# Monitoring  (Prometheus + Alertmanager)
# ──────────────────────────────────────────────
monitoring:
  enabled: true

  prometheus:
    image: prom/prometheus:v2.53.0
    pullPolicy: IfNotPresent
    retention: 15d
    resources: {}

  kubeStateMetrics:
    image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
    pullPolicy: IfNotPresent
    resources: {}

  alertmanager:
    image: prom/alertmanager:v0.27.0
    pullPolicy: IfNotPresent
    resources: {}

  # ── SMTP / email settings ──────────────────
  email:
    smtpHost: smtp.gmail.com
    smtpPort: "587"
    from: "mohammed.ehap.zean@gmail.com"
    # Comma-separated list of recipients
    to: "mohammed.ehap.sharaf@gmail.com"
    username: "mohammed.ehap.zean@gmail.com"
    # Gmail App Password (16 chars, no spaces)
    # Override via:  --set monitoring.email.password=xxxxxxxxxxxxxxxx
    # or a gitignored values.secret.yaml file — NEVER commit the real value!
    password: "iktskxktmutjbmut"
    requireTLS: true

  # ── Alert thresholds ───────────────────────
  alerts:
    # seconds a pod must be unavailable before firing
    podDownForSeconds: 60
    crashLoopingForSeconds: 60
    # number of restarts in 5 min that triggers the warning
    highRestartsThreshold: 3
    # seconds PVC must be un-bound before firing
    pvcPendingForSeconds: 120
    # repeat the same alert after this interval (e.g. 4h)
    repeatInterval: 4h
